<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07070b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>FLEXORA</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070b; --card: rgba(255,255,255,0.045); --card2: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.09); --text: #f2f2f7; --muted: #9a9ab2;
      --accent: #7c5cff; --teal: #00e5c0; --coral: #ff6b6b; --orange: #ff9f43;
      --safe: env(safe-area-inset-bottom, 16px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; user-select: none; }
    html[dir="rtl"] body { font-family: 'Heebo', 'Inter', system-ui, sans-serif; }
    .glow { position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse 90% 45% at 50% -15%, rgba(124,92,255,.22), transparent),
                  radial-gradient(ellipse 50% 35% at 100% 60%, rgba(0,229,192,.08), transparent); }
    #app { position: relative; z-index: 1; max-width: 430px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
    .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; animation: in .3s ease; }
    .screen.on { display: flex; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .topbar { padding: 14px 20px 6px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-family: 'Outfit'; font-weight: 800; font-size: 26px; letter-spacing: -.5px;
      background: linear-gradient(135deg,#fff,#c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    html[dir="rtl"] .brand { font-family: 'Heebo'; letter-spacing: 0; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--card); border: 1px solid var(--border);
      display: grid; place-items: center; font-size: 16px; cursor: pointer; font-weight: 700; }
    .content { flex: 1; overflow-y: auto; padding: 8px 20px calc(90px + var(--safe)); scrollbar-width: none; }
    .content::-webkit-scrollbar { display: none; }
    .hero { background: linear-gradient(150deg,#1a1430,#0c1a1c); border: 1px solid rgba(124,92,255,.3);
      border-radius: 24px; padding: 22px; margin-bottom: 22px; box-shadow: 0 16px 40px -10px rgba(124,92,255,.3); }
    .badge { display: inline-flex; gap: 6px; align-items: center; background: rgba(0,229,192,.15); color: var(--teal);
      font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 20px; margin-bottom: 10px; }
    .hero h2 { font-family: 'Outfit'; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    html[dir="rtl"] .hero h2 { font-family: 'Heebo'; }
    .hero p { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .pose-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .pose-pill { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.08); display: grid; place-items: center; font-size: 15px; }
    .btn { width: 100%; padding: 15px; border: none; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s; }
    .btn:active { transform: scale(.97); }
    .btn-main { background: linear-gradient(135deg, var(--accent), #9b7bff); color: #fff; box-shadow: 0 8px 24px rgba(124,92,255,.4); }
    .sec { font-size: 12px; font-weight: 700; letter-spacing: .6px; color: var(--muted); text-transform: uppercase; margin: 18px 0 12px;
      display: flex; justify-content: space-between; align-items: center; }
    html[dir="rtl"] .sec { letter-spacing: 0; text-transform: none; }
    .sec a { color: var(--teal); text-decoration: none; font-size: 12px; }
    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
    .chip { flex-shrink: 0; padding: 8px 14px; border-radius: 20px; background: var(--card); border: 1px solid var(--border);
      font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
    .chip.on { background: rgba(124,92,255,.2); border-color: var(--accent); color: #fff; }
    .areas { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 20px; }
    .area { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 8px; text-align: center; cursor: pointer; }
    .area:active { background: var(--card2); }
    .area .i { font-size: 26px; margin-bottom: 6px; }
    .area .n { font-size: 11px; font-weight: 600; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .item { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; cursor: pointer; }
    .item:active { background: var(--card2); }
    .item .ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; overflow: hidden; }
    .item .ico svg { width: 28px; height: 28px; }
    .item .info { flex: 1; min-width: 0; }
    .item h3 { font-size: 14px; font-weight: 600; }
    .item p { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .diff { font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 6px; }
    .diff.beginner { background: rgba(0,229,192,.15); color: var(--teal); }
    .diff.intermediate { background: rgba(255,159,67,.15); color: var(--orange); }
    .diff.advanced { background: rgba(255,107,107,.15); color: var(--coral); }
    .time { font-size: 11px; font-weight: 600; color: var(--teal); background: rgba(0,229,192,.1); padding: 4px 8px; border-radius: 8px; }
    .nav { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(7,7,11,.92); backdrop-filter: blur(16px);
      border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0 calc(8px + var(--safe)); z-index: 40; }
    .nav button { background: none; border: none; color: var(--muted); font-size: 10px; font-weight: 500;
      display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 14px; cursor: pointer; }
    .nav button.on { color: var(--teal); }
    .nav button span { font-size: 20px; }
    .player { flex: 1; display: flex; flex-direction: column; padding: 12px 18px calc(18px + var(--safe)); }
    .p-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .p-bar { flex: 1; height: 4px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; }
    .p-fill { height: 100%; background: linear-gradient(90deg,var(--teal),var(--accent)); transition: width .3s; }
    .pose-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .pose-visual {
      width: 210px; height: 210px; border-radius: 50%;
      background: linear-gradient(145deg, rgba(124,92,255,.22), rgba(0,229,192,.12));
      border: 2px solid rgba(255,255,255,.12);
      display: grid; place-items: center; position: relative; margin-bottom: 18px;
      box-shadow: 0 0 50px rgba(124,92,255,.25); overflow: hidden;
    }
    .pose-visual svg { width: 140px; height: 140px; }
    .pose-visual::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--teal); animation: spin 7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pose-title { font-family: 'Outfit'; font-size: 24px; font-weight: 700; }
    html[dir="rtl"] .pose-title { font-family: 'Heebo'; }
    .pose-meta { color: var(--teal); font-size: 13px; font-weight: 600; margin: 4px 0 12px; }
    .timer { font-family: 'Outfit'; font-size: 52px; font-weight: 800; letter-spacing: -1px;
      background: linear-gradient(135deg,#fff,var(--teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .steps { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin: 14px 0; text-align: start;
      font-size: 13px; color: var(--muted); max-height: 110px; overflow-y: auto; }
    .steps strong { color: var(--text); }
    .steps ol { padding-inline-start: 18px; margin-top: 6px; }
    .steps li { margin-bottom: 4px; }
    .controls { display: flex; justify-content: center; align-items: center; gap: 18px; }
    .cbtn { width: 52px; height: 52px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); display: grid; place-items: center; font-size: 20px; cursor: pointer; }
    .cbtn.play { width: 68px; height: 68px; font-size: 26px; background: linear-gradient(135deg,var(--accent),#9b7bff); border: none; box-shadow: 0 8px 28px rgba(124,92,255,.45); }
    .overlay { position: fixed; inset: 0; z-index: 100; background: rgba(7,7,11,.96); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; }
    .overlay.show { display: flex; animation: in .35s; }
    .overlay .big { font-size: 72px; margin-bottom: 12px; }
    .overlay h2 { font-family: 'Outfit'; font-size: 28px; margin-bottom: 6px; }
    html[dir="rtl"] .overlay h2 { font-family: 'Heebo'; }
    .streak-pill { display: inline-flex; gap: 8px; align-items: center; background: rgba(255,159,67,.15); color: var(--orange); padding: 10px 18px; border-radius: 30px; font-weight: 700; margin: 18px 0 28px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; }
    .stat .v { font-family: 'Outfit'; font-size: 26px; font-weight: 800; background: linear-gradient(135deg,var(--teal),var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .flexo { background: linear-gradient(150deg,#1a1430,#0c1a1c); border: 1px solid rgba(124,92,255,.25); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 20px; }
    .ring { width: 120px; height: 120px; margin: 0 auto 12px; position: relative; }
    .ring svg { transform: rotate(-90deg); }
    .ring .val { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Outfit'; font-size: 30px; font-weight: 800; }
    .radar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
    .rchip { padding: 7px 12px; border-radius: 16px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,.06); border: 1px solid var(--border); }
    .rchip.ok { background: rgba(0,229,192,.12); border-color: var(--teal); color: var(--teal); }
    .rchip.miss { background: rgba(255,107,107,.1); border-color: var(--coral); color: var(--coral); }
    .builder-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; min-height: 40px; }
    .b-item { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; cursor: grab; transition: opacity .2s, transform .15s; }
    .b-item.dragging { opacity: 0.45; transform: scale(0.98); }
    .b-item .handle { color: var(--muted); font-size: 18px; cursor: grab; padding: 0 4px; }
    .b-item .name { flex: 1; font-size: 13px; font-weight: 600; }
    .b-item .sec { color: var(--muted); font-size: 12px; margin: 0; }
    .b-item button { background: none; border: none; color: var(--coral); font-size: 16px; cursor: pointer; padding: 4px; }
    .drop-target { border: 2px dashed var(--accent) !important; background: rgba(124,92,255,.1) !important; }
    .search { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; margin-bottom: 14px; }
    .search input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14px; }
    .search input::placeholder { color: var(--muted); }
    .note { background: rgba(124,92,255,.12); border: 1px solid rgba(124,92,255,.25); border-radius: 12px; padding: 12px; font-size: 12px; color: var(--muted); margin-bottom: 16px; }
    .lang-toggle { font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 20px; background: var(--card); border: 1px solid var(--border); cursor: pointer; color: var(--text); }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div id="app">
    <!-- HOME -->
    <div id="home" class="screen on">
      <div class="topbar">
        <div class="brand">FLEXORA</div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="lang-toggle" id="langBtn" onclick="toggleLang()">עב</button>
          <button class="icon-btn" onclick="go('progress')">🔥</button>
          <button class="icon-btn" onclick="alert(t('reminders'))">🔔</button>
        </div>
      </div>
      <div class="content">
        <div class="note" id="upgradeNote"></div>
        <div class="hero">
          <div class="badge" id="heroBadge"></div>
          <h2 id="heroTitle"></h2>
          <p id="heroSub"></p>
          <div class="pose-row" id="heroPoses"></div>
          <button class="btn btn-main" id="heroBtn" onclick="start('wake-beginner')"></button>
        </div>
        <div class="sec" id="secArea"></div>
        <div class="areas" id="areasGrid"></div>
        <div class="sec" id="secDiff"></div>
        <div class="filters" id="diffFilters">
          <div class="chip on" data-d="all" onclick="setDiff(this)" id="chipAll"></div>
          <div class="chip" data-d="beginner" onclick="setDiff(this)" id="chipBeg"></div>
          <div class="chip" data-d="intermediate" onclick="setDiff(this)" id="chipInt"></div>
          <div class="chip" data-d="advanced" onclick="setDiff(this)" id="chipAdv"></div>
        </div>
        <div class="sec"><span id="secRoutines"></span> <a href="#" onclick="go('library');return false" id="seeAll"></a></div>
        <div class="list" id="homeList"></div>
      </div>
    </div>

    <!-- LIBRARY -->
    <div id="library" class="screen">
      <div class="topbar">
        <div class="brand" style="font-size:22px" id="libTitle"></div>
        <button class="icon-btn" onclick="go('home')">←</button>
      </div>
      <div class="content">
        <div class="search"><span>🔍</span><input id="q" oninput="renderLibrary()" /></div>
        <div class="filters" id="libDiff">
          <div class="chip on" data-d="all" onclick="setLibDiff(this)" id="lchipAll"></div>
          <div class="chip" data-d="beginner" onclick="setLibDiff(this)" id="lchipBeg"></div>
          <div class="chip" data-d="intermediate" onclick="setLibDiff(this)" id="lchipInt"></div>
          <div class="chip" data-d="advanced" onclick="setLibDiff(this)" id="lchipAdv"></div>
        </div>
        <div class="list" id="libList"></div>
      </div>
    </div>

    <!-- PROGRESS -->
    <div id="progress" class="screen">
      <div class="topbar">
        <div class="brand" style="font-size:22px" id="progTitle"></div>
        <button class="icon-btn" onclick="go('home')">←</button>
      </div>
      <div class="content">
        <div class="flexo">
          <div class="ring">
            <svg width="120" height="120" viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="9"/>
              <circle id="ringArc" cx="60" cy="60" r="52" fill="none" stroke="url(#g)" stroke-width="9" stroke-dasharray="327" stroke-dashoffset="40" stroke-linecap="round"/>
              <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00e5c0"/><stop offset="100%" stop-color="#7c5cff"/></linearGradient></defs>
            </svg>
            <div class="val" id="flexVal">92%</div>
          </div>
          <div style="font-family:'Outfit';font-weight:700;font-size:16px" id="flexTitle"></div>
          <div style="color:var(--muted);font-size:12px;margin-top:2px" id="flexSub"></div>
        </div>
        <div class="stats">
          <div class="stat"><div class="v" id="streak">12</div><div class="l" id="lStreak"></div></div>
          <div class="stat"><div class="v" id="sessions">0</div><div class="l" id="lSessions"></div></div>
          <div class="stat"><div class="v" id="minutes">0</div><div class="l" id="lMinutes"></div></div>
          <div class="stat"><div class="v" id="routinesDone">0</div><div class="l" id="lRoutines"></div></div>
        </div>
        <div class="sec" id="secRadar"></div>
        <div class="radar" id="radar"></div>
        <p style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:20px" id="radarTip"></p>
        <button class="btn btn-main" id="btnCustom" onclick="go('builder')"></button>
      </div>
    </div>

    <!-- BUILDER -->
    <div id="builder" class="screen">
      <div class="topbar">
        <div class="brand" style="font-size:20px" id="builderTitle"></div>
        <button class="icon-btn" onclick="go('progress')">←</button>
      </div>
      <div class="content">
        <div class="note" id="builderNote"></div>
        <input id="customName" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:12px;font-size:14px" />
        <div class="builder-list" id="builderList"></div>
        <div class="sec" id="secAdd"></div>
        <div class="list" id="addPoses"></div>
        <button class="btn btn-main" style="margin-top:16px" id="btnSave" onclick="saveCustom()"></button>
      </div>
    </div>

    <!-- PLAYER -->
    <div id="player" class="screen">
      <div class="player">
        <div class="p-top">
          <button class="icon-btn" onclick="exitPlayer()">✕</button>
          <div class="p-bar"><div class="p-fill" id="pFill" style="width:0%"></div></div>
          <button class="icon-btn" id="voiceBtn" onclick="toggleVoice()">🔊</button>
        </div>
        <div class="pose-stage">
          <div class="pose-visual" id="pVisual"></div>
          <div class="pose-title" id="pName"></div>
          <div class="pose-meta" id="pSide"></div>
          <div class="timer" id="pTimer">0:30</div>
          <div style="font-size:12px;color:var(--muted)" id="pTimerLabel"></div>
        </div>
        <div class="steps" id="pSteps"></div>
        <div class="controls">
          <button class="cbtn" onclick="prev()">⏮</button>
          <button class="cbtn play" id="playBtn" onclick="toggle()">▶</button>
          <button class="cbtn" onclick="next()">⏭</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="done">
      <div class="big">🎉</div>
      <h2 id="doneTitle"></h2>
      <p style="color:var(--muted)" id="doneSub"></p>
      <div class="streak-pill" id="doneStreak"></div>
      <button class="btn btn-main" style="max-width:260px" id="doneBtn" onclick="closeDone()"></button>
    </div>

    <nav class="nav" id="nav">
      <button class="on" data-s="home" onclick="go('home')"><span>🏠</span><span id="navHome"></span></button>
      <button data-s="library" onclick="go('library')"><span>📚</span><span id="navLib"></span></button>
      <button data-s="progress" onclick="go('progress')"><span>📊</span><span id="navProg"></span></button>
    </nav>
  </div>

  <script>
    // ========== SVG Pose Illustrations (simple elegant stick figures) ==========
    const SVG = {
      fold: `<svg viewBox="0 0 100 100" fill="none" stroke="#e0e0ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="18" r="8" fill="#c4b5fd"/><path d="M50 26v12M38 70L50 38L62 70M30 55h40"/></svg>`,
      lunge: `<svg viewBox="0 0 100 100" fill="none" stroke="#e0e0ff" stroke-width="3.5" stroke-linecap="round"><circle cx="42" cy="16" r="8" fill="#c4b5fd"/><path d="M42 24v20M30 90L42 44L58 70M58 70L70 90M42 44h20"/></svg>`,
      twist: `<svg viewBox="0 0 100 100" fill="none" stroke="#e0e0ff" stroke-width="3.5" stroke-linecap="round"><circle cx="50" cy="18" r="8" fill="#c4b5fd"/><path d="M50 26v30M35 90v-20h30v20M50 56c-15-5-20-15-18-25M50 56c15-5 20-15 18-25"/></svg>`,
      reach: `<svg viewBox="0 0 100 100" fill="none" stroke="#e0e0ff" stroke-width="3.5" stroke-linecap="round"><circle cx="50" cy="28" r="8" fill="#c4b5fd"/><path d="M50 36v28M35 90L50 64L65 90M30 20L50 36L70 20"/></svg>`,
      child: `<svg viewBox="0 0 100 100" fill="none" stroke="#e0e0ff" stroke-width="3.5" stroke-linecap="round"><circle cx="28" cy="48" r="7" fill="#c4b5fd"/><path d="M35 48h30c8 0 12 8 12 16v10H28v-10c0-6 2-12 7-16M28 74h50"/></svg>`,
      chest: `<svg viewBox="0 0 100 100" fill="none" stroke="#e0e0ff" stroke-width="3.5" stroke-linecap="round"><circle cx="50" cy="18" r="8" fill="#c4b5fd"/><path d="M50 26v30M35 90L50 56L65 90M25 40c10 5 15 5 25 0M75 40c-10 5-15 5-25 0"/></svg>`,
      dog: `<svg viewBox="0 0 100 100" fill="none" stroke="#e0e0ff" stroke-width="3.5" stroke-linecap="round"><circle cx="72" cy="28" r="7" fill="#c4b5fd"/><path d="M28 78L50 30L72 35M28 78h-8M72 35v-7"/></svg>`,
      default: `<svg viewBox="0 0 100 100" fill="none" stroke="#e0e0ff" stroke-width="3.5" stroke-linecap="round"><circle cx="50" cy="18" r="8" fill="#c4b5fd"/><path d="M50 26v34M35 90L50 60L65 90M30 40h40"/></svg>`
    };
    function poseSVG(key) {
      const map = { 'wide-fold':'fold','forward-fold':'fold','seated-fold':'fold','lunge':'lunge','runner':'lunge','twist':'twist','supine-twist':'twist','reach':'reach','child':'child','chest':'chest','cactus':'chest','doorway':'chest','downdog':'dog' };
      return SVG[map[key] || 'default'];
    }

    let store=load();
    (function(){const today=new Date().toDateString();if(store.lastDate&&store.lastDate!==today){const y=new Date();y.setDate(y.getDate()-1);if(store.lastDate!==y.toDateString())store.streak=0;}})();

    function go(name){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));document.getElementById(name).classList.add("on");document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.s===name));document.getElementById("nav").style.display=(name==="player"||name==="builder")?"none":"flex";if(name==="library")renderLibrary();if(name==="progress")renderProgress();if(name==="builder")renderBuilder();if(name==="home")renderHome();}
    function setDiff(el){document.querySelectorAll("#diffFilters .chip").forEach(c=>c.classList.remove("on"));el.classList.add("on");activeDiff=el.dataset.d;renderHome();}
    function setLibDiff(el){document.querySelectorAll("#libDiff .chip").forEach(c=>c.classList.remove("on"));el.classList.add("on");libDiff=el.dataset.d;renderLibrary();}
    function filterArea(a){areaFilter=a;activeDiff="all";document.querySelectorAll("#diffFilters .chip").forEach(c=>c.classList.toggle("on",c.dataset.d==="all"));go("library");renderLibrary();}

    function poseName(p){return p.name[lang]||p.name.en;}
    function poseSide(p){return p.side[lang]||p.side.en;}
    function poseSteps(p){return p.steps[lang]||p.steps.en;}
    function routName(r){return r.name[lang]||r.name.en;}

    function makeItem(id,r){
      const first=POSES[r.poses[0]]||{emoji:"🧘"};
      return `<div class="item" onclick="start('${id}')">
        <div class="ico" style="background:rgba(124,92,255,.15)">${poseSVG(r.poses[0])}</div>
        <div class="info"><h3>${routName(r)}</h3><p>${r.poses.length} · ${t('areas')[r.area]||r.area}</p></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <span class="diff ${r.difficulty}">${t(r.difficulty)}</span>
          <span class="time">${r.duration} ${lang==='he'?'דק׳':'min'}</span>
        </div></div>`;
    }
    function renderHome(){
      const list=document.getElementById("homeList");let html="";
      Object.entries(ROUTINES).forEach(([id,r])=>{if(activeDiff!=="all"&&r.difficulty!==activeDiff)return;html+=makeItem(id,r);});
      Object.entries(store.customs).forEach(([id,r])=>{html+=makeItem(id,r);});
      list.innerHTML=html||`<p style='color:var(--muted);font-size:13px'>—</p>`;
      const wake=ROUTINES["wake-beginner"];
      document.getElementById("heroPoses").innerHTML=wake.poses.slice(0,8).map(p=>`<div class="pose-pill">${POSES[p].emoji}</div>`).join("");
    }
    function renderLibrary(){
      const q=(document.getElementById("q").value||"").toLowerCase();
      const list=document.getElementById("libList");let html="";
      const all={...ROUTINES,...store.customs};
      Object.entries(all).forEach(([id,r])=>{
        if(libDiff!=="all"&&r.difficulty!==libDiff)return;
        if(areaFilter&&r.area!==areaFilter&&r.area!=="full")return;
        const nm=routName(r).toLowerCase();
        if(q&&!nm.includes(q)&&!r.area.includes(q))return;
        html+=makeItem(id,r);
      });
      list.innerHTML=html||`<p style='color:var(--muted)'>—</p>`;
    }
    function renderProgress(){
      document.getElementById("streak").textContent=store.streak;
      document.getElementById("sessions").textContent=store.sessions;
      document.getElementById("minutes").textContent=store.minutes;
      document.getElementById("routinesDone").textContent=store.routines;
      const areas=["neck","shoulders","back","hips","hamstrings","full"];
      let miss=[];
      document.getElementById("radar").innerHTML=areas.map(a=>{
        const done=store.areas[a]; if(!done)miss.push(t('areas')[a]);
        return `<div class="rchip ${done?"ok":"miss"}">${t('areas')[a]} ${done?"✓":"·"}</div>`;
      }).join("");
      document.getElementById("radarTip").textContent=miss.length?t('tip')(miss[0]):t('balanced');
      const pct=Math.min(99,70+store.sessions*2);
      document.getElementById("flexVal").textContent=pct+"%";
      document.getElementById("ringArc").setAttribute("stroke-dashoffset",327-(327*pct/100));
    }

    function start(id){
      current=ROUTINES[id]||store.customs[id]; if(!current)return;
      idx=0; go("player"); loadPose();
      setTimeout(()=>{if(!playing)toggle();},500);
    }
    function loadPose(){
      const pid=current.poses[idx];
      const p=POSES[pid]||{emoji:"🧘",name:{en:pid,he:pid},side:{en:"Hold",he:"החזקה"},time:30,steps:{en:["Hold"],he:["החזק"]}};
      document.getElementById("pVisual").innerHTML=poseSVG(pid);
      document.getElementById("pName").textContent=poseName(p);
      document.getElementById("pSide").textContent=poseSide(p);
      document.getElementById("pSteps").innerHTML=`<strong>${t('how')}</strong><ol>${poseSteps(p).map(s=>`<li>${s}</li>`).join("")}</ol>`;
      left=p.time; updateTimer();
      document.getElementById("pFill").style.width=((idx/current.poses.length)*100)+"%";
      if(voice)speak(poseName(p)+". "+poseSide(p));
    }
    function updateTimer(){const m=Math.floor(left/60),s=left%60;document.getElementById("pTimer").textContent=m+":"+s.toString().padStart(2,"0");}
    function toggle(){playing=!playing;document.getElementById("playBtn").textContent=playing?"⏸":"▶";if(playing){timer=setInterval(()=>{left--;updateTimer();if(left<=0){if(idx<current.poses.length-1){idx++;loadPose();}else{clearInterval(timer);playing=false;finish();}}},1000);}else clearInterval(timer);}
    function next(){if(idx<current.poses.length-1){idx++;loadPose();}else finish();}
    function prev(){if(idx>0){idx--;loadPose();}}
    function exitPlayer(){clearInterval(timer);playing=false;go("home");}
    function finish(){
      clearInterval(timer);playing=false;
      const today=new Date().toDateString();
      if(store.lastDate!==today){store.streak=(store.lastDate?store.streak+1:1);store.lastDate=today;}
      store.sessions++;store.minutes+=current.duration||5;store.routines++;
      store.areas[current.area]=true;
      if(current.area==="full")["neck","shoulders","back","hips","hamstrings"].forEach(a=>store.areas[a]=true);
      save(store);
      document.getElementById("doneStreak").textContent=`🔥 ${store.streak} ${lang==='he'?'ימים ברצף':'day streak'}`;
      document.getElementById("done").classList.add("show");
      if(voice)speak(lang==='he'?"כל הכבוד. האימון הסתיים.":"Amazing work. Session complete.");
    }
    function closeDone(){document.getElementById("done").classList.remove("show");go("home");renderHome();}
    function toggleVoice(){voice=!voice;document.getElementById("voiceBtn").textContent=voice?"🔊":"🔇";}
    function speak(t){if(!voice||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang=lang==='he'?'he-IL':'en-US';u.rate=0.95;speechSynthesis.cancel();speechSynthesis.speak(u);}

    // ========== Drag & Drop Builder ==========
    let dragIdx = null;
    function renderBuilder(){
      const list=document.getElementById("builderList");
      list.innerHTML=customPoses.map((pid,i)=>{
        const p=POSES[pid];
        return `<div class="b-item" draggable="true" data-i="${i}" ondragstart="onDragStart(event)" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragend="onDragEnd(event)">
          <span class="handle">☰</span>
          <span class="name">${p.emoji} ${poseName(p)}</span>
          <span class="sec">${p.time}s</span>
          <button onclick="removePose(${i})">✕</button>
        </div>`;
      }).join("") || `<p style='color:var(--muted);font-size:13px'>—</p>`;
      document.getElementById("addPoses").innerHTML=Object.entries(POSES).map(([id,p])=>
        `<div class="item" onclick="addPose('${id}')"><div class="ico">${poseSVG(id)}</div><div class="info"><h3>${poseName(p)}</h3><p>${t('areas')[p.area]} · ${p.time}s</p></div><span style="color:var(--teal);font-weight:700">+</span></div>`
      ).join("");
    }
    function onDragStart(e){ dragIdx=+e.currentTarget.dataset.i; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
    function onDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drop-target'); }
    function onDrop(e){
      e.preventDefault();
      const to=+e.currentTarget.dataset.i;
      if(dragIdx===null||dragIdx===to)return;
      const item=customPoses.splice(dragIdx,1)[0];
      customPoses.splice(to,0,item);
      renderBuilder();
    }
    function onDragEnd(e){ document.querySelectorAll('.b-item').forEach(el=>{el.classList.remove('dragging','drop-target');}); dragIdx=null; }
    function addPose(id){customPoses.push(id);renderBuilder();}
    function removePose(i){customPoses.splice(i,1);renderBuilder();}
    function saveCustom(){
      if(customPoses.length<2){alert(t('need2'));return;}
      const name=document.getElementById("customName").value|| (lang==='he'?'שגרה שלי':'My Custom');
      const id="custom-"+Date.now();
      const dur=Math.round(customPoses.reduce((s,p)=>s+(POSES[p].time||30),0)/60)||5;
      store.customs[id]={name:{en:name,he:name},area:"full",difficulty:"beginner",duration:dur,poses:[...customPoses]};
      save(store); customPoses=[]; alert(t('saved')); go("library");
    }

    applyLang();
  </script>
</body>
</html>
